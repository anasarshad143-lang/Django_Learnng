{% extends "base.html" %}

{% block title %}
Payment Successful
{% endblock %}

{% block content %}

<div style="
    max-width: 650px;
    margin: 70px auto;
    padding: 40px;
    background: white;
    border-radius: 16px;
    text-align: center;
">

    <h1 style="color: #65172e;">
        Payment Successful ✓
    </h1>

    <p>
        Your payment for
        <strong>{{ payment.course.title }}</strong>
        was successful.
    </p>

    <p>
        You are now enrolled in this course.
    </p>

    <a
        href="{% url 'my_courses' %}"
        style="
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #65172e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        "
    >
        Go to My Courses
    </a>

</div>

{% endblock %}
