{% extends "base.html" %}


{% block title %}
Reset Password | E-Learning
{% endblock %}


{% block content %}

<div class="form-card">


    <h1>
        Create New Password
    </h1>


    <p class="form-subtitle">
        Enter your new password below.
    </p>


    {% if error %}

        <div class="message error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <p>

            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter new password"
                required
            >

        </p>


        <p>

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Enter password again"
                required
            >

        </p>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Change Password
        </button>


    </form>


</div>

{% endblock %}
