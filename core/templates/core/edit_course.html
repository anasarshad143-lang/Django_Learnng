{% extends "core/base.html" %}

{% block title %}Edit Course - E-Learning{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-header">
        <div class="form-icon">✏️</div>

        <div>
            <span class="form-label">COURSE MANAGEMENT</span>
            <h1>Edit Course</h1>
            <p>Update the information for {{ course.title }}.</p>
        </div>
    </div>


    <div class="form-card-modern">

        <div class="section-eyebrow">Update Information</div>
        <h2>Course Details</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">

                <button type="submit" class="primary-btn">
                    Update Course
                </button>

                <a href="{% url 'course-detail' course.pk %}" class="secondary-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>


<style>

.form-page {
    max-width: 750px;
    margin: 0 auto;
}

.form-header {
    background: linear-gradient(135deg, var(--navy), #115e59);
    color: white;
    padding: 38px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

.form-icon {
    width: 65px;
    height: 65px;
    border-radius: 16px;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

.form-label {
    color: #99f6e4;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
}

.form-header h1 {
    margin: 7px 0;
    font-size: 32px;
}

.form-header p {
    margin: 0;
    color: #ccfbf1;
    font-size: 14px;
}

.form-card-modern {
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 35px;
}

.form-card-modern h2 {
    color: var(--navy);
    margin: 0 0 25px;
    font-size: 23px;
}

.form-card-modern form p {
    margin-bottom: 20px;
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

.primary-btn {
    flex: 1;
    background: var(--accent);
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 9px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
}

.primary-btn:hover {
    background: var(--accent-dark);
}

.secondary-btn {
    padding: 13px 22px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--navy);
    font-weight: 600;
}

.secondary-btn:hover {
    text-decoration: none;
    background: #f1f5f9;
}

@media (max-width: 768px) {
    .form-header {
        padding: 28px;
        flex-direction: column;
        align-items: flex-start;
    }

    .form-card-modern {
        padding: 25px;
    }

    .form-actions {
        flex-direction: column;
    }
}

</style>

{% endblock %}
