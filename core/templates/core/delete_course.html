{% extends "core/base.html" %}

{% block title %}Delete Course - E-Learning{% endblock %}

{% block content %}

<h1>Delete Course</h1>

<p>
    Are you sure you want to delete
    <strong>{{ course }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

</form>

<br>

<a href="{% url 'course-detail' course.pk %}">Cancel</a>

{% endblock %}
