{% extends 'core/base.html' %}

{% block title %}Edit Profile - E-Learning{% endblock %}

{% block content %}
<h2>Edit Profile</h2>

{% if messages %}
    {% for message in messages %}
        <p style="color: green;">{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Changes</button>
</form>
{% endblock %}
