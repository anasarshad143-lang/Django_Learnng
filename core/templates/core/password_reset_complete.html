{% extends "core/base.html" %}

{% block title %}Password Reset Complete - E-Learning{% endblock %}

{% block content %}
<style>
  :root {
    --primary: #0d9488;
    --primary-hover: #0f766e;
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
  }

  .auth-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 120px);
    padding: 2rem 1rem;
    background-color: var(--bg-color);
  }

  .auth-card {
    background: var(--card-bg);
    width: 100%;
    max-width: 440px;
    padding: 2.5rem;
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    border: 1px solid var(--border-color);
    text-align: center;
  }

  .auth-icon {
    font-size: 2.75rem;
    margin-bottom: 0.75rem;
    display: inline-block;
  }

  .auth-card h1 {
    color: var(--text-main);
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin: 0 0 0.75rem;
  }

  .auth-card p {
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0 0 1.5rem;
  }

  .auth-button {
    display: inline-block;
    width: 100%;
    padding: 0.85rem;
    background-color: var(--primary);
    color: #ffffff !important;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none !important;
    box-sizing: border-box;
    transition: background-color 0.15s ease-in-out;
  }

  .auth-button:hover {
    background-color: var(--primary-hover);
  }
</style>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">✅</div>
        <h1>Password Reset Successful</h1>
        <p>
            Your password has been changed successfully.
            You can now log in with your new password.
        </p>

        <a href="{% url 'login' %}" class="auth-button">Go to Login</a>
    </div>
</div>
{% endblock %}
